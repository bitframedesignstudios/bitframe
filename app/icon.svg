<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>

    <!-- Cobalt Accent Gradient -->
    <linearGradient id="cobalt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg-grad)"/>
  <rect x="32" y="32" width="448" height="448" rx="100" fill="none" stroke="#27272a" stroke-width="8"/>

  <!-- Geometric "B" Mark -->
  <path d="M 136 144
           H 230
           C 275 144, 305 165, 305 204
           C 305 230, 290 250, 268 256
           C 298 262, 316 286, 316 318
           C 316 360, 280 384, 230 384
           H 136
           Z
           M 188 188
           V 238
           H 225
           C 245 238, 256 228, 256 213
           C 256 198, 245 188, 225 188
           Z
           M 188 284
           V 340
           H 230
           C 252 340, 264 328, 264 312
           C 264 296, 252 284, 230 284
           Z" 
        fill="#f8fafc"/>

  <!-- Interlocking Modern "F" Mark -->
  <path d="M 332 144
           H 400
           V 188
           H 332
           V 256
           H 388
           V 300
           H 332
           V 384
           H 284
           V 144
           Z" 
